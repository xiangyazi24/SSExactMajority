name: Q10130 robust linear species numerics

on:
  push:
    branches: [scratch]
    paths:
      - 'q10130/run.py'
      - '.github/workflows/q10130-numerics.yml'

permissions:
  contents: write

jobs:
  cells:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        k: [1, 2, 3]
        ei: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          mkdir -p result
          python q10130/run.py cell '${{ matrix.k }}' '${{ matrix.ei }}' 'result/cell-${{ matrix.k }}-${{ matrix.ei }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.k }}-${{ matrix.ei }}
          path: result/cell-${{ matrix.k }}-${{ matrix.ei }}.json
          retention-days: 2

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          mkdir -p result
          python q10130/run.py edge result/edge.json
      - uses: actions/upload-artifact@v4
        with:
          name: edge
          path: result/edge.json
          retention-days: 2

  aggregate:
    needs: [cells, edge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: result
          merge-multiple: true
      - run: |
          ls -l result
          test $(find result -name 'cell-*.json' | wc -l) -eq 12
          test -f result/edge.json
          python q10130/run.py aggregate result q10130/summary.json
          cat q10130/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: q10130-summary
          path: q10130/summary.json
          retention-days: 2
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin scratch
          git add q10130/summary.json
          git commit -m 'Q10130 numerical results' || true
          git push origin HEAD:scratch
